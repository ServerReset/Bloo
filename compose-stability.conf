# Classes the Compose compiler must treat as STABLE even though it does not
# compile them itself.
#
# Everything in com.bloo.bluelink.data lives in :shared, which is a plain
# android.library with no Compose compiler plugin -- it is shared with the Wear
# module and has no UI in it. The compiler cannot infer stability for a class it
# did not compile, so it assumes the worst: Vehicle, VehicleStatus, GeoLocation,
# Weather, EvTrip, ClimatePreset, SeatConfig, Powertrain and the rest were all
# UNSTABLE to the phone app.
#
# That is not a small detail. Skippability is all-or-nothing per call site, so a
# single unstable parameter makes a composable non-skippable no matter what the
# other parameters are. VehicleDetailContent takes `Vehicle` and hands it to the
# whole pebble column, which meant the pages could never skip -- and every other
# stability fix aimed at those call sites (the @Immutable on UiState, the
# @Stable on AppViewModel) was blocked behind this one, unable to have any
# effect on its own.
#
# The claim is true of these types: they are data classes of vals parsed from
# JSON or read from disk, with no mutable collection fields and no var fields
# anywhere in the package. Keep it that way -- a var here silently makes this
# file a lie, and the symptom is a stale UI rather than a slow one.
com.bloo.bluelink.data.*
