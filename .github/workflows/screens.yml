name: Screens

# Builds the debug APK and photographs its sample garage on an emulator (see .github/screens.sh), printing the
# pictures and frame timings into the log. It never signs, releases or uploads anything. It runs by hand, or on a
# push whose commit message contains "[screens]" (a dispatch only works once the workflow is on the default branch).
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleSideloadDebug --stacktrace

      # Hardware acceleration for the emulator: GitHub's Linux runners have KVM, but its device is not open to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Photograph the sample garage
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/screens.sh

  # The watch app on a Wear OS emulator, with sample cars (see .github/screens-wear.sh).
  watch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the watch debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :wear:assembleSideloadDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Photograph the watch
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          ram-size: 2048M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/screens-wear.sh


  # Frame timing of this commit against a baseline build, on one emulator (see .github/perf.sh). Runs on "[perf]" in the commit message.
  perf:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[perf]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASE_SHA: e332a2f3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build this commit and the baseline
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleSideloadDebug -q
          cp "$(ls app/build/outputs/apk/sideload/debug/*.apk | head -1)" /tmp/head.apk
          cp .github/perf.sh /tmp/perf.sh
          git checkout -q "$BASE_SHA"
          chmod +x ./gradlew
          ./gradlew :app:assembleSideloadDebug -q
          cp "$(ls app/build/outputs/apk/sideload/debug/*.apk | head -1)" /tmp/base.apk
          git checkout -q "$GITHUB_SHA"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Time both builds
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash /tmp/perf.sh
