name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: bloo-phone-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: bloo-wear-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # actions/upload-artifact above is what the in-app update flow used to
      # point at, but Actions artifacts are always served zipped AND require
      # a signed-in GitHub session to download at all -- fine for a human
      # browsing the Actions tab, useless for "tap a button in the app and
      # get an installable APK." A GitHub Release's assets are plain public
      # files (no auth, no zip): tapping the download link goes straight to
      # the raw .apk. One rolling pre-release per push, tagged by run number
      # so nothing collides with the tag-triggered release job below.
      - name: Publish build as a GitHub Release (direct APK downloads)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          prerelease: true
          files: |
            app/build/outputs/apk/debug/Bloo.apk
            wear/build/outputs/apk/debug/Bloo-Wear.apk

  # A separate, manually-tagged Release ("vN") for anyone who wants a stable
  # build instead of the rolling "build-<run number>" pre-release the build
  # job above publishes on every push. Only runs on a version tag push, never
  # on ordinary branch pushes or PRs. The in-app update checker (UpdateApi)
  # ignores these — it only reads "build-" tagged releases, which exist for
  # every ordinary push and carry a comparable run number.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release build type also uses the checked-in debug signing config (see
      # app/build.gradle.kts) so this is a normally-installable signed APK,
      # not an unsigned one — same key as every debug build, so it installs
      # over an existing debug install without an uninstall first.
      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Bloo.apk
            wear/build/outputs/apk/release/Bloo-Wear.apk
          generate_release_notes: true
