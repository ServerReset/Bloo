name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags, not the default single-commit shallow clone --
          # the changelog step below needs to walk from the previous "build-N"
          # tag to HEAD, and diff/list tags at all.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: DIAGNOSTIC - dump merged manifest androidx.startup initializers
        run: |
          find app/build -iname "AndroidManifest.xml" -path "*merged*" -exec echo "=== {} ===" \; -exec grep -A2 "androidx.startup\|InitializationProvider\|meta-data" {} \;

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # The release variant is the ONLY thing that runs R8. Both modules shipped
      # `isMinifyEnabled = false` alongside declared proguardFiles for the whole life of
      # the project, so every keep rule in them was dead configuration that read like
      # protection -- and nothing here would have noticed. With shrinking now on, this
      # step is what turns "the rules parse and R8 resolves every reference it keeps"
      # into a build-time answer instead of a runtime surprise.
      #
      # It is NOT a proof the release APK works: there is no emulator here, so nothing
      # ever RUNS it. That gap is why renaming stays off (-dontobfuscate) -- see
      # app/proguard-rules.pro. Verifying behaviour still needs a human installing the
      # artifact below.
      - name: Build release APKs (runs R8 -- the only check on proguard-rules.pro)
        run: ./gradlew assembleRelease --stacktrace

      # assembleRelease also runs lintVitalRelease (AGP does this for release variants
      # only), whose FATAL-severity findings abort the build. Those reports are the one
      # diagnostic this workflow produces that cannot be reconstructed from the run
      # status, and the first thing anyone will want when this step goes red -- so keep
      # them even, especially, on failure.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            wear/build/reports/lint-results-*.html
            wear/build/reports/lint-results-*.txt
          if-no-files-found: ignore

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: bloo-phone-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: bloo-wear-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The shrunk APKs, so the release build can actually be installed and exercised --
      # which is the only way to confirm no keep is missing. Separate artifacts from the
      # debug ones above; those stay the default download for day-to-day sideloading.
      - name: Upload release APKs (R8-shrunk, for on-device verification)
        uses: actions/upload-artifact@v4
        with:
          name: bloo-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # GitHub's own generate_release_notes only lists merged PRs since the
      # last release -- this repo pushes straight to its branch with no PRs,
      # so that feature was silently producing an empty "## What's Changed"
      # section every single build (just a trailing compare-link line, which
      # UpdateApi.extractChangelog then discarded as not real content). The
      # in-app update tile's "What's new" section was quietly empty as a
      # result. Real per-commit messages since the previous "build-N" tag,
      # written into release_notes.md ourselves, is what UpdateApi actually
      # reads as this build's patch notes.
      - name: Generate changelog
        if: github.event_name == 'push'
        run: |
          git fetch --tags --quiet
          prev_tag=$(git tag -l 'build-*' | sed 's/^build-//' | sort -n | tail -1)
          {
            echo "### How to install"
            echo "1. Download \`Bloo.apk\` below (and \`Bloo-Wear.apk\` for the watch)."
            echo "2. Open the downloaded file from your notification shade or Downloads app."
            echo "3. If Android shows **\"Blocked by Play Protect\"**, tap **\"More details\"**, then **\"Install anyway\"** and confirm with your biometrics or device password."
            echo
            echo "Already have Bloo installed? Just open the app and pull to refresh — it'll offer to download and install this build for you."
            echo
            echo "### What's changed"
            if [ -n "$prev_tag" ]; then
              git log --pretty=format:'- %s' "build-$prev_tag"..HEAD
            else
              git log --pretty=format:'- %s' -n 20
            fi
          } > release_notes.md

      # actions/upload-artifact above is what the in-app update flow used to
      # point at, but Actions artifacts are always served zipped AND require
      # a signed-in GitHub session to download at all -- fine for a human
      # browsing the Actions tab, useless for "tap a button in the app and
      # get an installable APK." A GitHub Release's assets are plain public
      # files (no auth, no zip): tapping the download link goes straight to
      # the raw .apk. One rolling pre-release per push, tagged by run number
      # so nothing collides with the tag-triggered release job below.
      - name: Publish build as a GitHub Release (direct APK downloads)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          prerelease: true
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/debug/Bloo.apk
            wear/build/outputs/apk/debug/Bloo-Wear.apk

  # A separate, manually-tagged Release ("vN") for anyone who wants a stable
  # build instead of the rolling "build-<run number>" pre-release the build
  # job above publishes on every push. Only runs on a version tag push, never
  # on ordinary branch pushes or PRs. The in-app update checker (UpdateApi)
  # ignores these — it only reads "build-" tagged releases, which exist for
  # every ordinary push and carry a comparable run number.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release build type also uses the checked-in debug signing config (see
      # app/build.gradle.kts) so this is a normally-installable signed APK,
      # not an unsigned one — same key as every debug build, so it installs
      # over an existing debug install without an uninstall first.
      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Bloo.apk
            wear/build/outputs/apk/release/Bloo-Wear.apk
          generate_release_notes: true
