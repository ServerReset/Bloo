name: Build Android APK

on:
  push:
    branches: [ "**" ]
    # A `major-N` tag is the one thing that publishes to Google Play (see the upload step below).
    # Pushing one also builds and releases on GitHub like any other push, which is deliberate: the
    # sideload users get the same build, by the same route they always have.
    tags: [ "major-*" ]
  pull_request:
  # A manual run builds exactly what a push does, and can additionally hand the bundle to a Play track
  # -- `internal`, say, to get an installable build out without waiting for a rollout on a testing
  # track that Play will not promote yet. Empty means build only, like a push.
  workflow_dispatch:
    inputs:
      play_track:
        description: "Also upload this build to a Play track (internal, alpha, beta). Empty = build only."
        type: string
        default: ""

permissions:
  contents: write

# No concurrency group, on purpose: runs on the same branch may overlap. Cancelling the one in flight
# dropped builds people were waiting on, and the jobs that could starve each other are on separate
# runners anyway -- each job gets its own VM, so two runs do not contend for one.

jobs:
  # Every branch push builds the APKs and publishes them as the one rolling GitHub Release (see the
  # "Publish build" step below), tagged by run number. There is no separate marketing-version release
  # any more: the version IS the build number, so the newest push is always the Latest release and the
  # in-app updater always has one comparable number to check.
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags, not the default single-commit shallow clone --
          # the changelog step below needs to walk from the previous "build-N"
          # tag to HEAD, and diff/list tags at all.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No separate "Set up Android SDK" step: ubuntu-latest's own preinstalled
      # SDK (ANDROID_HOME already set, common platforms/build-tools already
      # present, licenses already accepted) is enough for AGP to build against,
      # and any missing SDK component AGP needs is fetched under the license
      # ubuntu-latest already accepted. `android-actions/setup-android@v3` used
      # to run here, but its own internal `sdkmanager tools` call now fails
      # unconditionally -- Google has fully removed the legacy standalone
      # "tools" package the action still hardcodes installing, so every build
      # using that action fails at this step regardless of anything in THIS
      # repo's own config, confirmed by a same-commit retry failing identically.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The release variants are signed with the upload key or NOT AT ALL (see app/build.gradle.kts
      # and wear/build.gradle.kts -- the fallback to the checked-in debug key is gone on purpose, and
      # that fallback is how a release signed with a public certificate got published). An unsigned
      # APK installs nowhere and an unsigned bundle uploads nowhere, so a run without the key would
      # go green and publish artifacts nobody can use. Fail here instead, before the build, with the
      # one thing that fixes it.
      - name: Require the real signing key
        env:
          KEYSTORE: ${{ secrets.BLOO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::BLOO_UPLOAD_KEYSTORE_BASE64 is not set, so this run cannot sign anything."
            echo "Release artifacts are never signed with the development key. Set the four upload-key"
            echo "secrets (see docs/PLAY.md, section 3), or build a debug APK locally instead."
            exit 1
          fi

      # One Gradle invocation, not two: every separate `./gradlew` call repeats
      # the whole project's CONFIGURATION phase (evaluating every build.gradle.kts
      # in :app/:shared/:uicommon/:hidden-api-stub) before it schedules a
      # single task, regardless of which task was asked for -- so running unit
      # tests and the release build as two invocations paid that cost twice for
      # no benefit. Gradle happily schedules both task graphs from one command
      # line and runs whichever of their shared dependencies only need building
      # once.
      #
      # The unit tests run per flavor -- testSideloadDebugUnitTest, testPlayDebugUnitTest --
      # rather than as a bare testDebugUnitTest, which does not exist now that the `distribution`
      # flavor dimension does. They only compile and run test sources, an internal step with no
      # artifact of its own; debug builds are gone from everything below this.
      #
      # assembleSideloadRelease and bundlePlayRelease are the ONLY things that run R8. Both modules shipped
      # `isMinifyEnabled = false` alongside declared proguardFiles for the whole life of
      # the project, so every keep rule in them was dead configuration that read like
      # protection -- and nothing here would have noticed. With shrinking now on, this
      # is what turns "the rules parse and R8 resolves every reference it keeps" into
      # a build-time answer instead of a runtime surprise.
      #
      # It is NOT a proof the release APK works: there is no emulator here, so nothing
      # ever RUNS it. That gap is why renaming stays off (-dontobfuscate) -- see
      # app/proguard-rules.pro. Verifying behaviour still needs a human installing
      # the release actually published below.
      # The major number, read off a `major-N` tag. Empty for an ordinary build, which is what
      # BLOO_MAJOR's `?: 0` in app/build.gradle.kts expects.
      - name: Read the major version off a major tag
        id: major
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/major-* ]]; then
            echo "major=${GITHUB_REF_NAME#major-}" >> "$GITHUB_OUTPUT"
          else
            echo "major=" >> "$GITHUB_OUTPUT"
          fi

      # The Play upload key, from a base64 secret, written somewhere the build can read and nowhere
      # that outlives the job. Absent (a fork, or a repo that has not set it up), the release build
      # falls back to the checked-in debug key -- see app/build.gradle.kts -- which still produces a
      # perfectly installable APK; it just cannot be uploaded to Play.
      - name: Write the Play upload key
        env:
          KEYSTORE: ${{ secrets.BLOO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "BLOO_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build the release APK + the Play bundle (runs R8 -- the only check on proguard-rules.pro)
        env:
          BLOO_MAJOR: ${{ steps.major.outputs.major }}
          BLOO_UPLOAD_STORE_PASSWORD: ${{ secrets.BLOO_UPLOAD_STORE_PASSWORD }}
          BLOO_UPLOAD_KEY_ALIAS: ${{ secrets.BLOO_UPLOAD_KEY_ALIAS }}
          BLOO_UPLOAD_KEY_PASSWORD: ${{ secrets.BLOO_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew testSideloadDebugUnitTest testPlayDebugUnitTest assembleSideloadRelease bundlePlayRelease :wear:assembleRelease --stacktrace

      # The Play artifact must never carry the restricted installer permissions. It does not today --
      # verified against the merged manifest, which is also what this checks on every run. Two things
      # put them back: REQUEST_INSTALL_PACKAGES via src/main, and the Shizuku runtime permission via
      # the provider AAR, which is exactly why src/play removes it explicitly. Both are rejections from
      # Play rather than warnings, and this is the cheapest possible way to never find that out late.
      #
      # Checked on the MERGED manifest, which the bundle task above already produced -- so this costs
      # no extra build and tests what is actually shipped, not what a source file says.
      - name: The Play artifact carries no installer permissions
        run: |
          # The BUNDLE, not an intermediate. `merged_manifests/` still contains the Shizuku permission
          # -- the removal in src/play is applied later in the pipeline -- so checking that reports a
          # failure for an artifact that is actually clean, and a guard that lies is worse than none.
          # The manifest proto inside the .aab is the thing that ships.
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          if [ ! -f "$aab" ]; then echo "::error::no play bundle to check"; exit 1; fi
          echo "checking $aab"
          fail=0
          for p in android.permission.REQUEST_INSTALL_PACKAGES moe.shizuku.manager.permission.API_V23; do
            if unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -qa "$p"; then
              echo "::error::$p is in the Play bundle"; fail=1
            else
              echo "  absent: $p"
            fi
          done
          exit $fail

      # Those release variants also run lintVitalRelease (AGP does this for release variants
      # only), whose FATAL-severity findings abort the build. Those reports are the one
      # diagnostic this workflow produces that cannot be reconstructed from the run
      # status, and the first thing anyone will want when this step goes red -- so keep
      # them even, especially, on failure.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: ignore

      # No actions/upload-artifact for the APKs themselves -- that was reported
      # directly as a real problem, not just an inconvenience: GitHub Actions
      # artifacts are ALWAYS served zipped (a single-file artifact still comes
      # down as a .zip you have to open before you can install it) AND require
      # a signed-in GitHub session to download at all. The GitHub Release
      # published a few steps down (direct, unzipped .apk assets, no auth) is
      # the only APK-delivery path left, and has been the only one the in-app
      # updater (UpdateApi, in :shared) has ever actually read -- confirmed:
      # it parses release.assets[].browser_download_url, never the Actions
      # artifacts API. Removing this saves two uploads (and their zip/upload
      # time) on every single push for a delivery path nothing was using.
      #
      # GitHub's own generate_release_notes only lists merged PRs since the
      # last release -- this repo pushes straight to its branch with no PRs,
      # so that feature was silently producing an empty "## What's Changed"
      # section every single build (just a trailing compare-link line, which
      # UpdateApi.extractChangelog then discarded as not real content). The
      # in-app update tile's "What's new" section was quietly empty as a
      # result. Real per-commit messages since the previous "build-N" tag,
      # written into release_notes.md ourselves, is what UpdateApi actually
      # reads as this build's patch notes.
      - name: Generate changelog
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git fetch --tags --quiet
          prev_tag=$(git tag -l 'build-*' | sed 's/^build-//' | sort -n | tail -1)
          {
            echo "## Bloo — build #${{ github.run_number }}"
            echo
            echo "Two apps in this release:"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`Bloo.apk\` | The phone app. **Install this first.** |"
            echo "| \`Bloo-watch.apk\` | The Wear OS companion. Only if you have a paired watch. |"
            echo
            echo "### Install — phone"
            echo "1. Download **\`Bloo.apk\`** from the Assets below."
            echo "2. Open it from your notification shade or the Downloads app."
            echo "3. If Android shows **\\\"Blocked by Play Protect\\\"**, tap **\\\"More details\\\"**, then **\\\"Install anyway\\\"**, and confirm with biometrics or your device password."
            echo
            echo "Already have Bloo? Just open it and pull to refresh — it offers to download and install this build for you."
            echo
            echo "### Install — watch (optional)"
            echo "Pair your watch to the phone first. Bloo then pushes the watch update to it for you: on the watch, open Bloo and tap **Update now**."
            echo "Or sideload \`Bloo-watch.apk\` manually the same way as the phone (see above)."
            echo
            echo "### What's changed"
            echo
            # Plain text, no markdown on purpose: this block is not only the release page, it is ALSO
            # what the app shows under "What's new" in its update tile, where it is rendered as-is.
            # This is the surviving channel to installs that can no longer update -- their tile and
            # their notification carry this release's own text, so a note here reaches them on every
            # build, however long they take to notice.
            echo "Installer saying \"App not installed\"? That copy was signed with Bloo's old key, and Android will not install any newer build over it. Nothing is wrong with the download. Export your settings first (Settings, Backup & sync, Export), uninstall Bloo, then install the newest Bloo.apk from this page and sign in again."
            echo
            if [ -n "$prev_tag" ]; then
              git log --pretty=format:'- %s' "build-$prev_tag"..HEAD
            else
              git log --pretty=format:'- %s' -n 20
            fi
            echo
          } > release_notes.md

      # See the comment above "No actions/upload-artifact for the APKs" for why
      # this Release, not an Actions artifact, is the one and only APK-delivery
      # path. One rolling release per push, tagged by run number. NOT a prerelease: it is the newest
      # build, so it should be the repo's "Latest release" for the humans arriving at the page (the
      # in-app updater reads the newest "build-" tag either way).
      # Created as a DRAFT: a draft is invisible to the in-app updater, so a build that is still uploading,
      # or whose tests later fail, is never offered. The `publish` job below makes it public only once
      # the whole run has passed.
      # The release title, built in a shell step rather than inline. It has to read "Build #2945",
      # and a `#` INSIDE a ${{ }} expression is a comment character to GitHub's expression lexer: it
      # swallowed the rest of the string literal, the expression never closed, and the whole workflow
      # failed to parse -- the run was created and instantly failed with no jobs at all. Here the #
      # lives in a shell string, where it is just a character.
      #
      # Ordinary builds carry the reinstall pointer in their NAME, and that is not decoration. The
      # name is the one piece of text the app renders without the user opening the releases page: it
      # is the whole body of the 12-hourly "update available" notification, and the summary line of
      # the update tile. Installs signed with the pre-Play key cannot install ANY newer build, and
      # the only symptom they get is the system installer saying "App not installed" -- so when they
      # tap Update on their own, this is the only place that can tell them why before it happens.
      - name: Pick the release title
        id: title
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          echo "title=Build #${{ github.run_number }} · reinstall if the update won't install" >> "$GITHUB_OUTPUT"

      # The Play upload comes BEFORE the GitHub release on purpose. It used to come after, and a
      # 403 from GitHub's release API -- which is what actually happened on the first major-2 run --
      # failed the job one step short of this one, so nothing reached Play and the closed-testing
      # track stayed empty. Publishing the version people test is not allowed to depend on a release
      # page being created.
      # Google Play, and ONLY from a `major-N` tag: an ordinary push is a CI build, and a build is
      # not a release. This is the whole trigger.
      #
      # The CLOSED track (the API calls it `alpha`), not internal. A personal developer account
      # created after 13 November 2023 has to run a closed test with at least 12 testers opted in
      # continuously for 14 days before it can even apply for production access -- and internal
      # testing does not count toward that. Uploading here is what starts the clock; the tester list
      # itself is still a console step.
      #
      # Testers install it within minutes (no review on a testing track). Promoting to open testing
      # or production stays a deliberate click in the console -- nothing here can ship to real users.
      - name: Upload the bundle to Google Play (closed testing)
        if: startsWith(github.ref, 'refs/tags/major-') || inputs.play_track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bloo.bluelink
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          # `tracks`, not the deprecated `track` (the action warns about it on every run).
          tracks: ${{ inputs.play_track != '' && inputs.play_track || 'alpha' }}
          # DRAFT, and this is not a preference. Play refuses anything else here:
          #   "Only releases with status draft may be created on draft app."
          # com.bloo.bluelink has never been published, so it is still a draft app, and on a
          # public-facing track it will only accept a draft release. The AAB uploads perfectly either
          # way -- it is the release object that is rejected, which is why the console showed an empty
          # release and nothing else.
          #
          # What this means in practice: the build lands on the closed track as a draft, and someone
          # clicks "Start rollout to closed testing" in the console. Once the app has gone live once
          # (production, or any track that has been rolled out), change this back to `completed` and
          # the upload will roll out by itself.
          # `internal` will take a completed release even while Play classes the app as a draft --
          # its release from major 1 is completed -- and a completed one is installable immediately.
          # The public-facing closed track refuses it at commit time, so a tag keeps using draft there.
          status: ${{ startsWith(github.ref, 'refs/tags/major-') && 'draft' || 'completed' }}
      # Branch pushes only. A `major-N` tag build gets its GitHub release from the branch push that
      # preceded it -- the same commit, published moments earlier -- and creating one from a TAG push
      # is what GitHub refuses: `Resource not accessible by integration`, reproducibly, on every tag,
      # while the identical call on a branch works. That refusal used to take the Play upload down
      # with it. A tag run now does exactly one thing: publish to Play.
      - name: Publish build as a GitHub Release (direct APK downloads)
        id: release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.title.outputs.title }}
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/sideload/release/Bloo.apk
            wear/build/outputs/apk/release/Bloo-watch.apk


  # Runs the app for real: boots an emulator and runs the instrumented tests in
  # app/src/androidTest -- layouts measured, gestures performed, the launch actually happening.
  # Everything in `build` above stops at "it compiles and the JVM tests pass"; this is the job that
  # answers "does it work". Independent of `build` so a UI regression is reported without blocking
  # (or being hidden by) the release path.
  ui-tests:
    runs-on: ubuntu-latest
    # A backstop, not the working limit: the script cannot hang any more (every adb call is wrapped in
    # `timeout`), so this only catches an emulator that never boots. It used to be what actually ended
    # the job -- at 30 minutes, every run, with the real failure three minutes in.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The action's default is 2GB, and this app is not small: on that the device stops answering
          # part-way through the suite. 4GB got it further (two tests instead of none); this gives it
          # real room, since the runner has 16GB and the emulator is the only thing on it.
          ram-size: 6144
          # The emulator's own per-app heap default is 256MB; the app is largeHeap and the UI suite
          # composes real screens.
          heap-size: 512
          disable-animations: true
          script: bash .github/ci-ui-tests.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  # Makes the build visible to the in-app updater (phone and watch) only once it is finished and the build
  # and the emulator tests both passed. Until then the release is a draft, which the updater cannot see.
  publish:
    # Only the build. The emulator tests report separately and must not hold the release back: when
    # they timed out (a runner the emulator would not boot on) this job was SKIPPED, so the release
    # stayed a draft and the in-app updater -- which only reads published releases -- never saw the
    # new build at all. A build that compiled and passed R8 is worth shipping; a slow emulator says
    # nothing about it either way.
    needs: [build]
    if: always() && github.event_name == 'push' && github.ref_type == 'branch' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ needs.build.outputs.release_id }}" \
            -d '{"draft":false,"make_latest":"true"}'
