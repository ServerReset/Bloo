org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
# shared -> uicommon -> {app, wear} is the module graph, so app and wear are
# both leaves that depend on the same two lower modules but not on each other
# -- once shared/uicommon are built, Gradle can compile app and wear (and run
# their independent task chains: resource merge, R8, dex) at the same time
# instead of strictly sequentially, which CI's own log shows happening today.
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
